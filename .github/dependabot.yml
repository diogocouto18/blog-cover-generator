# Dependabot version updates, batched into grouped weekly PRs. A cooldown
# delays freshly published releases, which limits exposure to compromised or
# quickly-yanked versions (supply-chain hardening).
version: 2
updates:
  # Actions are pinned to full commit SHAs (with a `# vX.Y.Z` comment);
  # Dependabot bumps both the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: '[CI]'
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: '[Chore]'
    # Major TypeScript bumps need migration work and are handled by hand.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node must track the supported Node runtime (22), not the latest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
